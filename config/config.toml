# Where applications go: "review" posts an embed for admins, "direct" opens a ticket right away
# Both optional — mode defaults to "review", timezone to "UTC"
[start_screen]
mode = "review"
# Timezone for timestamps in the review embed: "UTC" or an offset like "+03:00"
timezone = "UTC"

# Application handling — applies in both modes
# All fields optional
[start_screen.application]
# Role granted to the applicant when their application is accepted
role_id = "1486409575421968484"
# Ask the admin for a reason when denying; if false, the denial is sent without one
require_deny_reason = true
# DM the applicant a copy of their answers
send_copy = true
# Include the "Delete application" button on that DM copy
allow_delete = true

# Where review-mode applications are posted (review mode only)
# Required when mode is "review": channel. Optional: ticket_buttons
[start_screen.review]
channel = 1535615216769962074
# Attach Accept/Deny buttons to ticket channels opened from the review embed
# (decisions can still be made on the review embed itself)
ticket_buttons = false

# Ticket channel settings (direct mode and the open-ticket flow)
# Required: name_prefix. Optional: category, transcript_channel
[start_screen.ticket]
# Category new ticket channels are created in; empty string = no category
category = 1535615119822692412
name_prefix = "ticket-"
# Channel closed-ticket transcripts are posted to; empty string = transcripts disabled
transcript_channel = 1535615216769962074
